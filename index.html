<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:400,700&display=swap">

    <!-- Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <link rel="stylesheet" href="style.css">
    <title>Lista de tarefas</title>
</head>
<body>

    <div class="conteiner">
        
        <div class="top">
            <h1>Lista de tarefas</h1>

            <div class="addBox">
                <input type="text" id="taskInput" placeholder="Quer adicionar uma tarefa?">
                <button id="addBtn" onclick="addTask()"><i class="fa-solid fa-plus"></i></button>
            </div>
        </div>

        <h3>Tarefas pendentes</h3>
        <ul id="taskList" class="taskBox"></ul>

        <h3>Tarefas concluídas</h3>
        <ul id="completedList" class="taskBox"></ul>

        <button id="clearCompleted" onclick="excluirConcluidas()">
            <i class="fa-solid fa-trash"></i> Excluir tudo concluído
        </button>

    </div>

    <script src="script.js"></script>
</body>
</html>
